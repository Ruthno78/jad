<!doctype html>
<html lang="ht"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pa gen koneksyon</title>
<style>
 body{margin:0;display:grid;place-items:center;min-height:100vh;background:#0B1220;color:#e5e7eb;
      font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:24px}
 h1{font-size:1.25rem;margin:0 0 .5rem} p{color:#9ca3af;margin:0 0 1.5rem}
 button{min-height:52px;padding:0 24px;font-size:1rem;font-weight:700;border:0;border-radius:12px;
        background:#0EA5E9;color:#04121d}
</style></head>
<body><div>
  <h1>Pa gen koneksyon entènèt</h1>
  <p>Tcheke rezo w epi eseye ankò.</p>
  <button onclick="retry()">Eseye ankò</button>
</div>
<script>
  // Sèvi ak bridge natif la pou rechaje VRE paj sit la (auth.html, elt.)
  // n'ap eseye chaje a — pa yon adrès domèn fiks ki ta ka mennen sou
  // yon lòt paj (epi yon lòt logo).
  function retry() {
    if (window.NativeBridge && window.NativeBridge.retry) {
      window.NativeBridge.retry();
    } else {
      // Sekou si bridge la pa disponib pou nenpòt rezon
      location.href = '/public/auth.html';
    }
  }
</script>
</body></html>
