name: RHTN - Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Sync public/ into Android assets (local WebView app)
        run: |
          chmod +x scripts/sync-android-assets.sh
          ./scripts/sync-android-assets.sh

      - name: Prepare Gradle
        working-directory: android
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            echo "ERROR: gradlew not found."
            exit 1
          fi

      - name: Clean project
        working-directory: android
        run: ./gradlew clean --no-daemon

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        working-directory: android
        run: |
          mkdir -p output
          find . -type f -name "*.apk" -exec cp {} output/ \;
          if [ -z "$(find output -type f -name '*.apk' -print -quit)" ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi
          ls -lh output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JADSTACK-LOTTO-APK
          path: android/output/*.apk
          if-no-files-found: error
          retention-days: 30
