<body>
<main class="auth-shell">
  <div class="card auth-card">

    <div class="auth-top">
      <button class="btn btn-icon btn-ghost" id="theme-btn" data-i18n-aria="auth.chanje_tem" aria-label="Changer de thème" style="margin-left:auto"></button>
    </div>

    <div class="auth-logo-box">
      <span data-brand="wide" aria-label="JADSTACK LOTTO"></span>
    </div>

    <h1 data-i18n="auth.konekte_nan_kont_ou">Connectez-vous à votre compte</h1>
    <p class="sub" data-i18n="auth.antre_imel_modpas">Saisissez votre e-mail et votre mot de passe pour continuer.</p>

    <form id="login-form" novalidate>
      <div class="form-row">
        <label class="label" for="email" data-i18n="auth.imel">E-mail</label>
        <input class="input" id="email" type="email" required autocomplete="email" inputmode="email">
      </div>
      <div class="form-row">
        <label class="label" for="password" data-i18n="auth.modpas">Mot de passe</label>
        <input class="input" id="password" type="password" required minlength="6" autocomplete="current-password">
      </div>
      <div class="form-row" id="totp-row" hidden>
        <label class="label" for="totp" data-i18n="auth.kod_2fa">Code 2FA (6 chiffres)</label>
        <input class="input mono" id="totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      </div>
      <div id="err" class="alert alert-error" style="color:var(--danger);font-size:.9rem;margin-bottom:.75rem;display:none;"></div>
      <button class="btn btn-primary btn-lg" id="submit" style="width:100%;" data-i18n="auth.konekte">Se connecter</button>
      <p style="text-align:center;margin-top:1rem;">
        <a href="#" id="reset-lnk" style="font-size:.9rem;" data-i18n="auth.bliye_modpas">Mot de passe oublié ?</a>
      </p>
    </form>

    <!-- Fòm "nouveau mot de passe" — parèt uniquement lè moun nan klike lyen recovery
         a nan imèl li epi Supabase deklanche evènman PASSWORD_RECOVERY a.
         Rete kache tout lòt tan; pa entèfere ak login nòmal la. -->
    <form id="recovery-form" novalidate hidden>
      <h1 data-i18n="auth.nouvo_modpas_tit">Choisissez un nouveau mot de passe</h1>
      <p class="sub" data-i18n="auth.nouvo_modpas_sub">Saisissez votre nouveau mot de passe pour finaliser la modification.</p>
      <div class="form-row">
        <label class="label" for="new-password" data-i18n="auth.nouvo_modpas">Nouveau mot de passe</label>
        <input class="input" id="new-password" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-row">
        <label class="label" for="new-password-2" data-i18n="auth.konfime_modpas">Confirmez le nouveau mot de passe</label>
        <input class="input" id="new-password-2" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <div id="recovery-err" class="alert alert-error" style="color:var(--danger);font-size:.9rem;margin-bottom:.75rem;display:none;"></div>
      <button class="btn btn-primary btn-lg" id="recovery-submit" style="width:100%;" data-i18n="auth.chanje_modpas">Changer le mot de passe</button>
    </form>
  </div>
</main>

<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async function(){
  window.Lotri.paintBrand();
  window.Lotri.loadConfig();

  const loginForm = document.getElementById('login-form');
  const recoveryForm = document.getElementById('recovery-form');
  const recoveryErrEl = document.getElementById('recovery-err');
  const showRecoveryErr = (m)=>{ recoveryErrEl.textContent = m; recoveryErrEl.style.display='block'; };

  // Lè moun nan klike lyen "changer le mot de passe" ki nan imèl la, Supabase ranje
  // yon sesyon tanporè epi voye evènman PASSWORD_RECOVERY — se sèl fason
  // fyab pou konnen n ap nan flow sa a (pa depann sou paramèt URL yo,
  // Supabase ka chanje fòma yo). Masquer login la, montre fòm nouveau mot de passe la.
  window.Lotri.supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      loginForm.hidden = true;
      recoveryForm.hidden = false;
    }
  });

  recoveryForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    recoveryErrEl.style.display = 'none';
    const p1 = document.getElementById('new-password').value;
    const p2 = document.getElementById('new-password-2').value;
    const btn = document.getElementById('recovery-submit');

    if (p1.length < 6) { showRecoveryErr(window.Lotri.t('auth.modpas_two_kout', 'Le mot de passe doit contenir au moins 6 caractères.')); return; }
    if (p1 !== p2) { showRecoveryErr(window.Lotri.t('auth.modpas_pa_matche', 'Les deux mots de passe ne correspondent pas.')); return; }

    await window.Lotri.ui.busy(btn, async ()=>{
      const { error } = await window.Lotri.supabase.auth.updateUser({ password: p1 });
      if (error) { showRecoveryErr(error.message); return; }
      window.Lotri.toast(window.Lotri.t('auth.modpas_chanje_siksè', 'Votre mot de passe a été modifié. Vous êtes maintenant connecté.'));
      const prof = await window.Lotri.getProfile(true);
      if (prof && prof.role) { window.location.replace(window.Lotri.homeFor(prof.role)); }
      else { window.location.replace('auth.html'); }
    });
  });

  // Supabase mete `type=recovery` nan hash/query URL la lè moun nan soti
  // nan lyen imèl la. Verifye sa AVAN nenpòt redirection otomatik pou pa
  // voye moun nan sou dashboard li san li pa fin changer le mot de passe la.
  const isRecoveryLink = /[?&#]type=recovery\b/.test(window.location.hash + window.location.search);
  if (isRecoveryLink) {
    loginForm.hidden = true;
    recoveryForm.hidden = false;
  } else {
    const s = await window.Lotri.getSession();
    if (s) {
      const p = await window.Lotri.getProfile();
      if (p && p.role) { window.location.replace(window.Lotri.homeFor(p.role)); return; }
    }
  }

  const errEl = document.getElementById('err');
  const showErr = (m)=>{ errEl.textContent = m; errEl.style.display='block'; };
  const showEmailNotConfirmed = (email)=>{
    errEl.innerHTML = window.Lotri.t('auth.imel_pa_konfime',
      'Votre e-mail n\'est pas encore confirmé. Vérifiez votre boîte de réception (et les spams).') +
      ' <button type="button" id="resend-confirm" class="btn btn-sm btn-ghost" style="margin-left:.4rem">' +
      window.Lotri.t('auth.voye_imel_ankò', 'Renvoyer l\'e-mail') + '</button>';
    errEl.style.display = 'block';
    const rBtn = document.getElementById('resend-confirm');
    rBtn.onclick = async () => {
      await window.Lotri.ui.busy(rBtn, async () => {
        const { error } = await window.Lotri.supabase.auth.resend({ type: 'signup', email });
        if (error) { showErr(error.message); return; }
        window.Lotri.toast(window.Lotri.t('auth.imel_konfimasyon_voye', 'E-mail de confirmation renvoyé.'));
      });
    };
  };
  const totpRow = document.getElementById('totp-row');

  document.getElementById('login-form').addEventListener('submit', async (e)=>{
    e.preventDefault();
    errEl.style.display='none';
    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('submit');

    const emailErr = window.Lotri.validate.email(email);
    if (emailErr) { showErr(emailErr); return; }

    // Rate limit lokal + sèvè
    const guard = await window.Lotri.security.loginGuard(email);
    if (guard.blocked) { showErr(guard.message); return; }

    await window.Lotri.ui.busy(btn, async ()=>{
      const { error } = await window.Lotri.supabase.auth.signInWithPassword({ email, password });
      if (error) {
        await window.Lotri.security.noteLogin(email, false);
        if (/email not confirmed/i.test(error.message || '')) {
          showEmailNotConfirmed(email);
        } else {
          showErr(error.message === 'Invalid login credentials'
            ? window.Lotri.t('auth.login-ajan.imel_oswa_modpas_la_pa_korek', 'L\'e-mail ou le mot de passe est incorrect.')
            : error.message);
        }
        return;
      }
      const prof = await window.Lotri.getProfile(true);
      if (!prof) { showErr(window.Lotri.t('auth.login-ajan.kont_ou_pa_gen_pwofil_kontakte_administr', 'Votre compte n\'a pas de profil. Contactez l\'administrateur.')); await window.Lotri.supabase.auth.signOut(); return; }
      if (prof.status !== 'active') { showErr(window.Lotri.t('auth.login-ajan.kont_ou_pa_aktif', 'Votre compte n\'est pas actif.')); await window.Lotri.supabase.auth.signOut(); return; }

      // V80 — Biometrie native obligatwa pou Super Admin + Mini Super Admin.
      // Le mot de passe est valide, puis l'OS confirme Face/Fingerprint avant l'acces.
      // Les autres roles ne passent jamais par cette etape.
      if (window.Lotri.requireAdminBiometric) {
        const biometric = await window.Lotri.requireAdminBiometric(prof.role);
        if (!biometric.ok) {
          await window.Lotri.security.noteLogin(email, false);
          await window.Lotri.supabase.auth.signOut();
          showErr(biometric.error || 'Verifikasyon sekirite echwe. Aksè bloke.');
          return;
        }
      }

      // 2FA TOTP — uniquement Super Admin
      if (prof.role === 'super_admin' && prof.totp_enabled) {
        totpRow.hidden = false;
        const code = document.getElementById('totp').value.trim();
        if (!/^\d{6}$/.test(code)) { showErr(window.Lotri.t('auth.kod_2fa_antre', 'Saisissez le code 2FA à 6 chiffres pour continuer.')); return; }
        const { data: ok, error: twoFaError } = await window.Lotri.supabase.rpc('jl9_rpc_verify_totp', { _code: code });
        if (twoFaError || ok !== true) { await window.Lotri.security.noteLogin(email, false); await window.Lotri.supabase.auth.signOut(); showErr('Le code 2FA est incorrect.'); return; }
      }
      await window.Lotri.security.noteLogin(email, true);
      window.location.replace(window.Lotri.homeFor(prof.role));
    });
  });

  document.getElementById('reset-lnk').addEventListener('click', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('email').value.trim().toLowerCase();
    if (!email) { showErr(window.Lotri.t('auth.login-ajan.antre_imel_ou_anvan', 'Saisissez d\'abord votre e-mail.')); return; }
    const { error } = await window.Lotri.supabase.auth.resetPasswordForEmail(email,
      { redirectTo: window.location.origin + '/auth.html' });
    if (error) showErr(error.message); else window.Lotri.toast(window.Lotri.t('auth.login-ajan.nou_voye_yon_imel_pou_chanje_modpas_la', 'Nous avons envoyé un e-mail pour changer le mot de passe.'));
  });
});
</script>
